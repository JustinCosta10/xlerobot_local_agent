/**:
  ros__parameters:
    use_sim_time: true

/**/bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /__NS__/odom
    bt_loop_duration: 10
    default_server_timeout: 100
    wait_for_service_timeout: 1000
    transform_tolerance: 0.3
    navigators: [navigate_to_pose]
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator

/**/controller_server:
  ros__parameters:
    controller_frequency: 20.0
    costmap_update_timeout: 1.0
    enable_stamped_cmd_vel: true
    odom_topic: /__NS__/odom
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 1.0
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      # Aligning with the path/final heading is progress even without translation.
      plugin: nav2_controller::PoseProgressChecker
      required_movement_radius: 0.08
      required_movement_angle: 0.15
      movement_time_allowance: 30.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.12
      yaw_goal_tolerance: 0.15
      stateful: true
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.10
      lookahead_dist: 0.35
      min_lookahead_dist: 0.25
      max_lookahead_dist: 0.6
      use_velocity_scaled_lookahead_dist: false
      transform_tolerance: 0.3
      min_approach_linear_velocity: 0.025
      approach_velocity_scaling_dist: 0.5
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 2.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.6
      regulated_linear_scaling_min_speed: 0.03
      cost_scaling_dist: 0.6
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0
      use_rotate_to_heading: true
      rotate_to_heading_angular_vel: 0.15
      rotate_to_heading_min_angle: 0.4
      max_angular_accel: 1.0
      allow_reversing: false
      max_robot_pose_search_dist: 5.0

/**/local_costmap:
  ros__parameters:
    update_frequency: 5.0
    publish_frequency: 2.0
    # The nvblox layer expects a planar transform. map is floor-level whereas
    # wheel odom has its origin at the axle, so both costmaps use map here.
    global_frame: map
    robot_base_frame: base_link
    rolling_window: true
    width: 6
    height: 6
    resolution: 0.05
    transform_tolerance: 0.3
    # Cart, rear casters, tires and hubs in the axle-centered base_link frame.
    # Mesh/collision bounds rounded outward to 1 mm; arms excluded.
    footprint: "[[-0.356, -0.252], [0.064, -0.252], [0.064, 0.252], [-0.356, 0.252]]"
    footprint_padding: 0.02
    track_unknown_space: true
    always_send_full_costmap: true
    plugins: [nvblox_layer, footprint_layer, inflation_layer]
    nvblox_layer:
      plugin: nvblox::nav2::NvbloxCostmapLayer
      nav2_costmap_global_frame: map
      nvblox_map_slice_topic: /__NS__/nvblox_node/static_map_slice
      convert_to_binary_costmap: true
    # Only the area physically occupied by the robot is known free at startup.
    footprint_layer:
      plugin: nav2_costmap_2d::ObstacleLayer
      observation_sources: ""
      footprint_clearing_enabled: true
    inflation_layer:
      plugin: nav2_costmap_2d::InflationLayer
      cost_scaling_factor: 3.0
      inflation_radius: 0.8

/**/global_costmap:
  ros__parameters:
    update_frequency: 2.0
    publish_frequency: 1.0
    global_frame: map
    robot_base_frame: base_link
    rolling_window: false
    width: 16
    height: 16
    origin_x: -8.0
    origin_y: -8.0
    resolution: 0.05
    transform_tolerance: 0.3
    # Keep identical to the local cart-and-wheels footprint above.
    footprint: "[[-0.356, -0.252], [0.064, -0.252], [0.064, 0.252], [-0.356, 0.252]]"
    footprint_padding: 0.02
    track_unknown_space: true
    always_send_full_costmap: true
    plugins: [nvblox_layer, footprint_layer, inflation_layer]
    nvblox_layer:
      plugin: nvblox::nav2::NvbloxCostmapLayer
      nav2_costmap_global_frame: map
      nvblox_map_slice_topic: /__NS__/nvblox_node/static_map_slice
      convert_to_binary_costmap: true
    footprint_layer:
      plugin: nav2_costmap_2d::ObstacleLayer
      observation_sources: ""
      footprint_clearing_enabled: true
    inflation_layer:
      plugin: nav2_costmap_2d::InflationLayer
      cost_scaling_factor: 3.0
      inflation_radius: 0.8

/**/planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_smac_planner::SmacPlanner2D
      tolerance: 0.12
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

/**/behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    local_frame: map
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.3
    enable_stamped_cmd_vel: true
    behavior_plugins: [wait]
    wait:
      plugin: nav2_behaviors::Wait
