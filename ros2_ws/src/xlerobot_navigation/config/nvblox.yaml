/**:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    pose_frame: base_link
    use_tf_transforms: true
    num_cameras: 1
    use_depth: true
    use_color: true
    use_lidar: false
    input_qos: SENSOR_DATA
    voxel_size: 0.05
    mapping_type: static_tsdf
    esdf_mode: 2d
    publish_esdf_distance_slice: true
    integrate_depth_rate_hz: 15.0
    integrate_color_rate_hz: 5.0
    update_esdf_rate_hz: 5.0
    update_mesh_rate_hz: 2.0
    publish_layer_rate_hz: 2.0
    publish_debug_vis_rate_hz: 2.0
    maximum_input_queue_length: 10
    map_clearing_radius_m: 8.0
    map_clearing_frame_id: base_link
    layer_visualization_exclusion_radius_m: 8.0
    layer_visualization_exclusion_height_m: 1.7
    esdf_slice_bounds_visualization_attachment_frame_id: base_link
    workspace_height_bounds_visualization_attachment_frame_id: base_link
    # Keep static obstacles for this session. Dynamic scenes need another mode.
    decay_tsdf_rate_hz: 0.0
    static_mapper:
      projective_integrator_max_integration_distance_m: 6.0
      projective_integrator_max_weight: 5.0
      esdf_integrator_min_weight: 0.1
      esdf_integrator_max_distance_m: 2.0
      # map Z=0 is the simulator floor, not the wheel axle.
      esdf_slice_min_height: 0.08
      esdf_slice_max_height: 1.4
      esdf_slice_height: 0.1
      mesh_integrator_min_weight: 0.1
      layer_streamer_exclusion_radius_m: 8.0
      layer_streamer_exclusion_height_m: 1.7
