# Stock TWO-WHEEL mapping from Vector-Wangel/XLeRobot:
# software/src/robots/xlerobot_2wheels/xlerobot_2wheels.py (upstream main, 2026-10-19).
# No mapping/calibration from toro/xlerobot-pro is used.
# Copy this file, verify IDs, and fill every null before selecting backend:=hardware.
# zero_tick is Present_Position at URDF joint angle 0 after existing servo homing.
# direction maps increasing ticks to positive URDF radians. Calibration is in ticks;
# max_velocity is rad/s. Never substitute LeRobot normalized percentages/degrees.
# Servo operating modes must already be 0 (position joints) and 1 (wheels).
# The bridge does not change modes, EEPROM, IDs, homing offsets, or PID gains.
driver: sts3215
update_rate: 30.0
command_timeout: 0.5
buses:
  left_head:
    port: null
    baudrate: 1000000
  right_base:
    port: null
    baudrate: 1000000
joints:
  Rotation_L:
    bus: left_head
    id: 1
    zero_tick: null
    direction: null
    min_tick: null
    max_tick: null
    max_velocity: 0.5
  Pitch_L:
    bus: left_head
    id: 2
    zero_tick: null
